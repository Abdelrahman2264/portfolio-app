<header id="siteHeader" [class.scrolled]="isScrolled()">
  <nav class="wrap">
    
    <!-- Logo -->
    <a href="#home" class="logo" (click)="scrollToSection('home', $event)">
      <div class="logo-mark">AK</div>
      <span>Abdelrahman Khalaf</span>
    </a>

    <!-- Nav Links -->
    <div class="nav-links" [class.open]="isMobileMenuOpen()">
      <a 
        href="#home" 
        [class.active]="activeSection() === 'home'"
        (click)="scrollToSection('home', $event)">
        Home
      </a>
      <a 
        href="#about" 
        [class.active]="activeSection() === 'about'"
        (click)="scrollToSection('about', $event)">
        About
      </a>
      <a 
        href="#experience" 
        [class.active]="activeSection() === 'experience'"
        (click)="scrollToSection('experience', $event)">
        Experience
      </a>
      <a 
        href="#skills" 
        [class.active]="activeSection() === 'skills'"
        (click)="scrollToSection('skills', $event)">
        Skills
      </a>
      <a 
        href="#projects" 
        [class.active]="activeSection() === 'projects'"
        (click)="scrollToSection('projects', $event)">
        Projects
      </a>
      <a 
        href="#contact" 
        class="nav-cta"
        (click)="scrollToSection('contact', $event)">
        Contact
      </a>
    </div>

    <!-- Mobile Burger Toggle with Lucide Icon -->
    <button class="burger" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu">
      @if (isMobileMenuOpen()) {
        <lucide-icon [img]="icons.X" [size]="18" [strokeWidth]="2"></lucide-icon>
      } @else {
        <lucide-icon [img]="icons.Menu" [size]="18" [strokeWidth]="2"></lucide-icon>
      }
    </button>

  </nav>
</header>
